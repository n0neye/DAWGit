# Unity projects (the folder with Assets/ and ProjectSettings/).
name: unity
tool: Unity
open:
  files: ["."]          # the project, in the Unity version it was made with
  with: unity-editor
checks: [unity-meta]    # every asset with its .meta
detect: ["ProjectSettings/ProjectVersion.txt"]
ignore:
  - /Library/        # Unity's import cache: rebuilt from Assets
  - /Temp/
  - /Obj/
  - /Logs/
  - /UserSettings/   # per-person editor layout
  - /MemoryCaptures/
  - /.utmp/          # Unity 6's temporary files (Android builds)
  - /Build/
  - /Builds/
  - /.vs/
  - /.idea/
  - "/*.csproj"      # generated by Unity for the code editor
  - "/*.sln"
handlers:
  - files: ["*.cs", "*.shader", "*.hlsl", "*.cginc", "*.compute", "*.json", "*.asmdef", "*.asmref",
            "*.uss", "*.uxml", "*.txt", "*.md", "*.xml", "*.yaml", "*.yml", "*.meta"]
    merge: text
  # Scenes, prefabs and assets Unity saves as text (Force Text, the default):
  # merged object by object with Unity's own UnityYAMLMerge.
  - files: ["*.unity", "*.prefab", "*.asset", "*.mat", "*.anim", "*.controller", "*.overrideController",
            "*.mask", "*.playable", "*.signal", "*.mixer", "*.physicMaterial", "*.physicsMaterial2D",
            "*.renderTexture", "*.lighting", "*.terrainlayer", "*.spriteatlas", "*.spriteatlasv2",
            "*.preset", "*.guiskin", "*.fontsettings", "*.flare", "*.cubemap", "*.brush", "*.scenetemplate"]
    merge: unity-yaml
running: unity-editor
kinds:
  scene: ["*.unity"]
  prefab: ["*.prefab"]
  script: ["*.cs", "*.shader", "*.hlsl", "*.compute"]
  image: ["*.png", "*.jpg", "*.jpeg", "*.tga", "*.psd", "*.af", "*.exr", "*.hdr", "*.tif", "*.tiff"]
  model: ["*.fbx", "*.obj", "*.blend", "*.dae"]
  audio: ["*.wav", "*.aif", "*.aiff", "*.mp3", "*.ogg", "*.flac"]
  meta: ["*.meta"]
